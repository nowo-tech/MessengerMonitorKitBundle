settings:
    title: Messenger monitor settings
    intro: Runtime switches of the history and the purge of old rows. Changes apply without a redeploy.
    intro_store: Workers pick up a change within the configured check interval.
    intro_readonly: 'These switches come from the configuration (settings.store: config): recording %recording%, retention %retention%.'
    switches: Recording and retention
    save: Save
    recording: Record history
    recording_help: Off stops writing history rows; the pages, purges and retries keep working.
    record_optional: Record high-volume messages
    record_optional_help: Also record the message classes configured as optional (recording.optional_message_classes).
    auto_purge: Purge automatically
    auto_purge_help: The scheduled purge command deletes rows older than the retention below.
    retention: Retention
    retention_help: History older than this is deleted by the automatic purge.
    keep_failed: Keep failed messages
    keep_failed_help: The automatic purge keeps rows that failed.
    section:
        label: Messenger monitor
        intro: History recording and retention of the Messenger monitor.
