confirm:
    retry_title: Retry this message?
    retry: The message goes back to the "%transport%" transport and is handled again by its workers.
    retry_duplicate: Its handlers may already have done part of their work (e-mails, notifications, payments). Retrying can repeat those side effects. It goes back to "%transport%".
    remove_title: Remove this message?
    remove: The failed message is deleted from the failure transport. This cannot be undone.
    retry_all_title: Retry the failed messages?
    retry_all: 'Up to %count% failed messages go back to their original transport. Messages without one stay parked. Duplicate-risk messages are skipped: retry them one by one.'
    remove_all_title: Remove the failed messages?
    remove_all: Up to %count% failed messages are deleted. This cannot be undone.
